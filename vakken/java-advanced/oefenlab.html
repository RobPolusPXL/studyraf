<style>
/* Layout: één leeskolom per lab. Bovenaan uitleg met links naar de cursus, daaronder oefeningen. IntelliJ-opdrachten tonen één stap tegelijk. */
:root{
  --bg:#eef4ef; --surface:#ffffff; --ink:#15221a; --muted:#566659; --line:#d2ded4;
  --accent:#2b8a3e; --accent-soft:#dff1e2; --on-accent:#ffffff;
  --sky:#2361a6; --sky-soft:#e2ecf8;
  --java:#c0561a; --java-soft:#fbe9dd;
  --plum:#7a3d9c; --plum-soft:#f1e6f7;
  --sun:#9a6b00; --sun-soft:#fbf1d4;
  --ok:#1f7a3a; --ok-soft:#d9f0df; --bad:#b32b2b; --bad-soft:#f9e1e1;
  --code-bg:#14201a; --code-ink:#dbe7df; --code-dim:#7b8f82;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}


*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.8rem;letter-spacing:-.02em;margin:0}
.brand h1 span{color:var(--accent)}
.brand a{font-family:var(--f-mono);font-size:.8rem;color:var(--sky)}
.xp{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.xp b{font-size:1.25rem;color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
nav#nav{display:flex;gap:8px;overflow-x:auto;padding-block:14px;scrollbar-width:thin}
nav#nav button{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.78rem;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
nav#nav .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
nav#nav button.part .dot{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);border-color:var(--accent)}
nav#nav button.done .dot{background:var(--accent);border-color:var(--accent)}
nav#nav button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h2{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.12;letter-spacing:-.02em;margin:4px 0 6px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1.18rem;margin:0 0 6px;text-wrap:balance}
p{margin:0 0 10px;max-width:68ch}
p:last-child{margin-bottom:0}
code{font-family:var(--f-mono);font-size:.84em;background:var(--accent-soft);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.lead{font-size:1.08rem;color:var(--muted)}
.reads{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
a.rd{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:600;text-decoration:none;color:var(--sky);background:var(--sky-soft);border:1px solid color-mix(in srgb,var(--sky) 30%,transparent);padding:4px 10px;border-radius:999px}
a.rd::before{content:"Cursus";font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
a.rd::after{content:"↗";font-size:.8em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card ul,.card ol{margin:6px 0 10px;padding-left:22px;max-width:66ch}
.card li{margin-bottom:4px}
.tip{border-left:4px solid var(--sun);background:var(--sun-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0}
.warn{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0}
pre.code{margin:10px 0;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:.8rem;line-height:1.6;overflow-x:auto;white-space:pre}
pre.code em{font-style:normal;color:#f2a46b}
pre.code b{color:#7fd38f;font-weight:600}
.sect{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;border-left-width:5px}
.ex.t-ij{border-left-color:var(--plum)} .ex.t-code{border-left-color:var(--java)} .ex.t-mc,.ex.t-sort,.ex.t-order,.ex.t-fill,.ex.t-line{border-left-color:var(--sky)}
.ex.solved{border-color:var(--ok);border-left-color:var(--ok)}
.ex .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.badge{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.badge .ty{padding:2px 7px;border-radius:5px;background:var(--sky-soft);color:var(--sky)}
.t-ij .badge .ty{background:var(--plum-soft);color:var(--plum)}
.t-code .badge .ty{background:var(--java-soft);color:var(--java)}
.ex.solved .badge{color:var(--ok)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;width:100%}
.opt .k{font-family:var(--f-mono);font-weight:700;color:var(--muted);flex:0 0 auto}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt:disabled{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:700;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ij{background:var(--plum);border-color:var(--plum);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.fb{padding:11px 14px;border-radius:8px;font-size:.96rem}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.pool,.seq{display:flex;flex-direction:column;gap:6px;min-height:44px;padding:8px;border:1px dashed var(--line);border-radius:8px}
.chip{font:inherit;font-size:.94rem;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.seq .chip{border-color:var(--sky);background:var(--sky-soft)}
.seq .chip .nr{font-family:var(--f-mono);font-weight:700;color:var(--sky);margin-right:8px}
.lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sortrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:620px){.sortrow{grid-template-columns:minmax(0,1fr)}}
.sortrow:last-child{border-bottom:0}
.sortrow.wrong .txt{color:var(--bad)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:.84rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);font-weight:700}
.codelines{background:var(--code-bg);border-radius:8px;padding:8px 0;overflow-x:auto}
.cl{display:grid;grid-template-columns:34px minmax(0,1fr);width:100%;text-align:left;border:0;background:transparent;color:var(--code-ink);font-family:var(--f-mono);font-size:.8rem;line-height:1.75;padding:0 12px 0 0;cursor:pointer;white-space:pre}
.cl .n{color:var(--code-dim);text-align:right;padding-right:10px;user-select:none}
.cl[aria-pressed="true"]{background:#f0925a33}
.cl.good{background:#5cc47233}
pre.fill{white-space:pre;line-height:2}
pre.fill input{font:inherit;font-size:.8rem;background:#ffffff14;color:#f2d57a;border:1px solid #ffffff33;border-radius:4px;padding:1px 5px;min-width:5ch}
pre.fill input.ok{border-color:#5cc472;color:#7fd38f}
pre.fill input.bad{border-color:#f07b7b}
.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.reqs li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:.94rem}
.reqs .st{font-family:var(--f-mono);font-weight:700;text-align:center;color:var(--muted)}
.reqs li.ok .st{color:var(--ok)} .reqs li.bad .st{color:var(--bad)}
.editor{background:var(--code-bg);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.ebar{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;border-bottom:1px solid #ffffff14;font-family:var(--f-mono);font-size:.74rem;color:var(--code-dim)}
.ebar .path{color:var(--code-ink)}
.ebody{display:grid;grid-template-columns:auto minmax(0,1fr)}
.gutter{padding:12px 8px 12px 12px;text-align:right;color:var(--code-dim);font-family:var(--f-mono);font-size:.82rem;line-height:1.6;user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
textarea.code{width:100%;min-height:200px;resize:none;border:0;background:transparent;color:var(--code-ink);font-family:var(--f-mono);font-size:.82rem;line-height:1.6;padding:12px 14px 12px 6px;tab-size:4;white-space:pre;overflow:hidden;overflow-x:auto;caret-color:var(--accent)}
textarea.code:focus{outline:none}
details.sol{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 12px}
details.sol summary{cursor:pointer;font-family:var(--f-mono);font-size:.8rem;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.step .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem;border:2px solid var(--plum);color:var(--plum)}
.step.done .num{background:var(--plum);color:#fff}
.step.done .body{color:var(--muted)}
.step.done .body .stepact{display:none}
.step .body{min-width:0}
.step .body p{margin-bottom:6px}
.kbd{font-family:var(--f-mono);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--bg)}
.ui{font-weight:700;color:var(--plum)}
.see{border:1px dashed var(--plum);border-radius:8px;padding:8px 12px;font-size:.93rem;margin:6px 0}
.see b{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--plum);display:block}
details.help{font-size:.93rem;margin:4px 0 8px}
details.help summary{cursor:pointer;color:var(--sun);font-weight:600}
.stepact{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
input.ans{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:min(100%,320px)}
.navbtm{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.score{text-align:center;padding:26px 18px}
.score b{display:block;font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:.9rem}
</style>

<script>
const COURSE='./cursus.html';
const R=(id,label)=>`<a class="rd" href="${COURSE}#${id}" target="_blank" rel="noopener">${label}</a>`;
const K=k=>`<span class="kbd">${k}</span>`;
const U=t=>`<span class="ui">${t}</span>`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const SEE=(t)=>`<div class="see"><b>Dit zou je moeten zien</b>${t}</div>`;
const HELP=(t)=>`<details class="help"><summary>Lukt het niet?</summary>${t}</details>`;
const PRE=(t)=>`<pre class="code">${esc(t)}</pre>`;

/* ================= LABS ================= */
const LABS=[

/* ---------- LAB 1 ---------- */
{id:'lab1',tag:'H1 · De start',title:'Je eerste Spring Boot-project',
lead:'Vandaag schrijf je nog geen code. Je maakt een leeg project, je start het en je leert waar alles staat. Alles wat volgt bouwt hierop, dus neem je tijd.',
read:[['h1-1','1.1 Enterprise toepassingen'],['h1-2','1.2 Spring Initializr'],['h1-3','1.3 Project uitvoeren']],
blocks:[
{h:'Wat is Spring Boot?',html:`<p>Java is een taal. Wil je er een webshop of een API mee bouwen, dan heb je veel extra's nodig: een webserver, iets dat JSON maakt, een koppeling met een databank. <strong>Spring</strong> is een framework dat die stukken levert.</p><p><strong>Spring Boot</strong> is Spring met slimme standaardinstellingen. Je zegt welke stukken je wilt, en het werkt meteen, zonder lange configuratie.</p>`},
{h:'Waarvoor gebruiken bedrijven het?',html:`<p>Voor <em>enterprise toepassingen</em>: software die jaren meegaat, veel gebruikers aankan, veilig is en met andere systemen praat. Denk aan een bankapp of een planningssysteem van bpost.</p>`},
{h:'Hoe begin je?',html:`<p>Een projectstructuur maak je niet met de hand. <strong>Spring Initializr</strong> genereert ze. In IntelliJ Ultimate zit die wizard ingebouwd: je vult een paar velden in en krijgt een kant-en-klaar project.</p>`},
{h:'Drie plekken om te onthouden',html:`<ul><li><code>pom.xml</code> – de lijst van bibliotheken (<em>dependencies</em>) die je project gebruikt.</li><li><code>DemoApplication.java</code> – de klasse met <code>main</code>: hier start alles.</li><li><code>application.properties</code> – instellingen, bv. op welke poort je app draait.</li></ul>`}
],
ex:[
{type:'mc',title:'Wat is Spring Boot?',q:'Kies de beste omschrijving.',opts:[
 {t:'Een nieuwe programmeertaal die Java vervangt',no:'Je blijft gewoon Java schrijven. Spring Boot is iets dat je ermee gebruikt.'},
 {t:'Een framework bovenop Spring dat met slimme standaardinstellingen sneller een toepassing laat bouwen'},
 {t:'Een databank voor Java-programma\'s',no:'Spring Boot kan met databanken praten, maar is er zelf geen.'},
 {t:'Een plugin voor IntelliJ',no:'IntelliJ helpt je, maar Spring Boot werkt ook zonder IntelliJ.'}],a:1,
 why:'Spring = het framework. Spring Boot = Spring + auto-configuratie, zodat je bijna niets zelf moet instellen.'},
{type:'mc',title:'Spring Initializr',q:'Wat doet Spring Initializr voor jou?',opts:[
 {t:'Het start je applicatie op',no:'Dat doet de main-methode. Initializr komt daarvoor.'},
 {t:'Het genereert een leeg project met de juiste mappen, pom.xml en startklasse'},
 {t:'Het schrijft je controllers',no:'Die schrijf je zelf. Initializr maakt enkel het lege project.'}],a:1,
 why:'Initializr maakt het skelet: mappen, pom.xml met de gekozen dependencies, en een klasse met main.'},
{type:'mc',title:'Enterprise-kenmerk',q:'Een webshop moet op Black Friday tien keer meer bezoekers aankunnen dan normaal. Welk kenmerk van een enterprise toepassing is dat?',opts:[
 {t:'Schaalbaarheid'},{t:'Lange levensduur',no:'Lange levensduur gaat over jaren onderhoud, niet over drukte.'},{t:'Integratie',no:'Integratie is praten met andere systemen.'},{t:'Gebruikerservaring',no:'UX gaat over intuïtieve schermen.'}],a:0,
 why:'Schaalbaarheid: meer gebruikers en meer data aankunnen zonder de app te herschrijven.'},
{type:'ij',title:'Maak het project demo',q:'Je maakt je eerste project in IntelliJ. Eén stap tegelijk: vink een stap af en de volgende verschijnt.',steps:[
 `<p>Open IntelliJ IDEA. Staat er al een project open? Kies ${U('File → New → Project…')}. Zie je het welkomstscherm? Klik ${U('New Project')}.</p>`,
 `<p>Kies in de lijst links ${U('Spring Boot')}. (Staat er "Spring Initializr"? Dat is hetzelfde.)</p>${HELP('<p>Zie je geen Spring Boot? Dan heb je waarschijnlijk IntelliJ <em>Community</em>. Als student heb je gratis recht op Ultimate via je PXL-mail. Werk in afwachting via <a href="https://start.spring.io" target="_blank" rel="noopener">start.spring.io</a>: vul daar dezelfde velden in, klik Generate, pak de zip uit en open de map in IntelliJ.</p>')}`,
 `<p>Vul de velden in, precies zo:</p><ul><li>Name: <code>demo</code></li><li>Language: <strong>Java</strong></li><li>Type: <strong>Maven</strong></li><li>Group: <code>be.pxl</code></li><li>Artifact: <code>demo</code></li><li>Package name: <code>be.pxl.demo</code></li><li>JDK: een <strong>21</strong>, Java: <strong>21</strong></li><li>Packaging: <strong>Jar</strong></li></ul>${HELP('<p>Staat er bij JDK geen 21? Klik op de lijst → <em>Download JDK…</em> → versie 21, eender welke vendor (bv. Eclipse Temurin).</p>')}`,
 `<p>Klik ${U('Next')}. Bovenaan staat ${U('Spring Boot')} met een versie. Kies de hoogste versie die met <strong>3.</strong> begint en <em>geen</em> SNAPSHOT of M1 bevat.</p>${HELP('<p>SNAPSHOT en M1 zijn testversies. Begint de hoogste met 4.? Kies dan de hoogste 3.x eronder: de cursus is geschreven voor Spring Boot 3.</p>')}`,
 `<p>Kies <strong>geen</strong> dependencies. Laat alles leeg en klik ${U('Create')}.</p>`,
 `<p>IntelliJ opent het project. Rechtsonder zie je een voortgangsbalk: Maven downloadt bibliotheken. Wacht tot die weg is. De eerste keer kan dat een paar minuten duren.</p>${HELP('<p>Vraagt IntelliJ "Trust project?" → klik <em>Trust Project</em>.</p>')}`,
 `<p>Open links het ${U('Project')}-venster (${K('Alt')}+${K('1')}, op Mac ${K('⌘')}+${K('1')}). Klap open: <code>demo → src → main → java → be.pxl.demo</code>.</p>${SEE('<p>Een klasse <code>DemoApplication</code>, en in <code>src/main/resources</code> een bestand <code>application.properties</code>. Bovenaan in demo staat <code>pom.xml</code>.</p>')}`
],done:'Je project bestaat. Klaar voor de volgende opdracht: het starten.'},
{type:'ij',title:'Start je project',q:'Nu laat je het draaien.',steps:[
 `<p>Dubbelklik op <code>DemoApplication</code> om de klasse te openen. Je ziet de annotatie <code>@SpringBootApplication</code> en een <code>main</code>-methode.</p>`,

{h:'Annotaties: een etiket op je code',html:`<p>Een annotatie begint met <code>@</code> en plakt extra informatie op een klasse, methode of veld. Je kent er al één: <code>@Override</code>. Die zegt tegen de compiler: "deze methode overschrijft er een van de superklasse; geef een fout als dat niet klopt".</p><p>Spring leest annotaties en doet er iets mee. <code>@SpringBootApplication</code> zegt: "dit is het startpunt, configureer alles automatisch".</p>`},
{h:'pom.xml: je boodschappenlijst',html:`<p>In <code>pom.xml</code> staan de <strong>dependencies</strong>: bibliotheken die Maven voor je downloadt. Spring bundelt ze in <strong>starters</strong>, allemaal met de naam <code>spring-boot-starter-…</code>.</p>${PRE(`<parent>
    <artifactId>spring-boot-starter-parent</artifactId>
    <version>3.x.x</version>          ← de Spring Boot-versie
</parent>
<dependency>
    <artifactId>spring-boot-starter-test</artifactId>
    <scope>test</scope>               ← enkel voor testen
</dependency>`)}<div class="tip">Na een wijziging in pom.xml: klik op het Maven-icoon rechtsboven (<em>Load Maven Changes</em>).</div>`}
],

/* ---------- LAB 3 ---------- */
{id:'lab3',tag:'H1 · IoC',title:'Beans, IoC en dependency injection',
lead:'Het belangrijkste idee van Spring: jij maakt de objecten niet meer zelf, Spring doet het en geeft ze aan wie ze nodig heeft.',
read:[['h1-5','1.5 IoC en DI'],['h1-5-3','1.5.3 Application context'],['h1-5-4','1.5.4 IoC in werking']],
blocks:[
{h:'Het probleem',html:`<p>Een <code>Car</code> die in zijn constructor <code>engine = new Engine()</code> doet, zit vast aan die ene motor. Elektrisch maken? Herschrijven. Testen met een nepmotor? Kan niet. Dat heet <strong>nauwe koppeling</strong>.</p>`},
{h:'De oplossing in drie woorden',html:`<ul><li><strong>Inversion of Control</strong>: de controle over het maken van objecten draait om. Niet jouw klasse maar Spring maakt ze.</li><li><strong>Dependency injection</strong>: Spring geeft (injecteert) die objecten aan jouw klasse, meestal via de constructor.</li><li><strong>Bean</strong>: een object dat Spring beheert. Ze zitten allemaal in één doos: de <strong>application context</strong>.</li></ul>`},
{h:'Hoe maak je een bean?',html:`<p>Twee manieren:</p>${PRE(`@Component                       // op je eigen klasse: Spring doet "new"
public class WeatherService { ... }

@Bean                            // op een methode: jij doet "new"
public Pet myPet() { return new Pet("Scott", "Scotch Collie"); }`)}<p>Een bean die <code>CommandLineRunner</code> implementeert, krijgt zijn <code>run</code>-methode automatisch aangeroepen na het opstarten. Handig om iets te testen.</p>`}
],
ex:[
{type:'line',title:'Waar zit de koppeling?',q:'Klik op de regel die Car vastlijmt aan één soort motor.',code:`public class Car {
    private Engine engine;

    public Car() {
        engine = new Engine();
    }

    public void drive() {
        engine.start();
    }
}`,bad:[4],why:'Regel 5: Car kiest zelf zijn motor met new. Met constructor injection (public Car(Engine engine)) beslist iemand anders.'},
{type:'mc',title:'Wie maakt het object?',q:'Bij Inversion of Control: wie roept <code>new</code> op voor je beans?',opts:[
 {t:'De klasse die het object nodig heeft',no:'Dat is net de oude manier, zonder IoC.'},{t:'De Spring-container (application context)'},{t:'De main-methode, voor elke bean apart',no:'main roept enkel SpringApplication.run op. De rest doet de container.'}],a:1,
 why:'De container maakt en beheert de objecten. Jouw klasse vraagt ze enkel in haar constructor.'},
{type:'order',title:'Wat gebeurt er bij het opstarten?',q:'Zet in de juiste volgorde. Klik op een stap om ze toe te voegen; klik nog eens om ze terug te zetten.',items:[

{h:'REST in één alinea',html:`<p>Je app biedt <strong>resources</strong> aan (liedjes, huizen, superhelden). Elk heeft een adres: <code>/playlist/songs</code>. Andere programma's werken ermee via vier HTTP-methoden: <strong>GET</strong> ophalen, <strong>POST</strong> aanmaken, <strong>PUT</strong> wijzigen, <strong>DELETE</strong> verwijderen.</p>`},

{type:'code',title:'GET /greetings/daytime',q:'Oefening 2.1, deel 2. Voeg een methode toe die de datum teruggeeft zoals <em>Maandag 18 september 2023</em>.',file:'GreetingController.java (stukje)',
start:`@GetMapping("/daytime")
public String getDaytime() {
    // 1. haal de datum van vandaag op
    // 2. formatteer met DateTimeFormatter, in het Nederlands
    // 3. maak de eerste letter een hoofdletter
    return "";
}`,
reqs:[[/@GetMapping\s*\(\s*"\/daytime"\s*\)/,'Houd @GetMapping("/daytime").'],
 [/LocalDate(Time)?\.now\s*\(\s*\)/,'Gebruik LocalDate.now() voor de datum van vandaag.'],
 [/DateTimeFormatter\.ofPattern\s*\(\s*"EEEE d MMMM yyyy"/,'Gebruik het patroon "EEEE d MMMM yyyy" (EEEE = volledige dagnaam).'],
 [/(Locale\.forLanguageTag\s*\(\s*"nl|new\s+Locale\s*\(\s*"nl|Locale\.of\s*\(\s*"nl)/,'Geef een Nederlandse Locale mee, bv. Locale.forLanguageTag("nl-BE").'],
 [/toUpperCase\s*\(/,'Maak de eerste letter hoofdletter (substring(0,1).toUpperCase() + substring(1)).'],
 [/return\s+(?!"")[^;]+;/,'Geef de opgebouwde tekst terug.']],
sol:`@GetMapping("/daytime")
public String getDaytime() {
    DateTimeFormatter f = DateTimeFormatter.ofPattern("EEEE d MMMM yyyy", Locale.forLanguageTag("nl-BE"));
    String tekst = LocalDate.now().format(f);
    return tekst.substring(0, 1).toUpperCase() + tekst.substring(1);
}`},

{h:'Twee lagen',html:`<p><strong>Controller</strong> (<code>@RestController</code>): ontvangt het verzoek en zet JSON om. <strong>Service</strong> (<code>@Service</code>): bewaart de liedjes en bevat de logica. De controller krijgt de service via constructor injection.</p><p>Een <code>@Service</code> is een singleton: er is precies één, dus iedereen deelt dezelfde playlist.</p>`},

],

reqs:[[/@RestControllerAdvice\s+public\s+class\s+GlobalExceptionHandler/,'Zet @RestControllerAdvice boven de klasse.'],
 [/@ExceptionHandler\s*\(\s*MethodArgumentNotValidException\.class\s*\)/,'Zet @ExceptionHandler(MethodArgumentNotValidException.class) boven de methode.'],
 [/getAllErrors\s*\(\s*\)/,'Overloop ex.getBindingResult().getAllErrors().'],
 [/getDefaultMessage\s*\(\s*\)/,'Voeg per fout error.getDefaultMessage() toe aan de lijst.'],
 [/HttpStatus\.BAD_REQUEST|ResponseEntity\.badRequest\s*\(\s*\)/,'Geef status 400 terug (HttpStatus.BAD_REQUEST).']],
sol:`@RestControllerAdvice
public class GlobalExceptionHandler {
    @ExceptionHandler(MethodArgumentNotValidException.class)
    public ResponseEntity<List<String>> handleValidationErrors(MethodArgumentNotValidException ex) {
        List<String> errors = new ArrayList<>();
        for (ObjectError error : ex.getBindingResult().getAllErrors()) {
            errors.add(error.getDefaultMessage());
        }
        return new ResponseEntity<>(errors, HttpStatus.BAD_REQUEST);
    }
}`},

reqs:[[/if\s*\(\s*mission\.isCompleted\s*\(\s*\)\s*\)\s*\{?\s*throw\s+new\s+IllegalArgumentException/,'Controleer mission.isCompleted() en gooi een IllegalArgumentException.'],

    if (mission.isCompleted()) {

/* ================= ENGINE ================= */
const XPT={mc:10,sort:15,order:15,fill:15,line:15,code:25,ij:30};
const TYN={mc:'meerkeuze',sort:'sorteren',order:'volgorde',fill:'invullen',line:'zoek de regel',code:'code schrijven',ij:'in IntelliJ'};
const RANKS=[[0,'Starter'],[150,'Bean-bakker'],[400,'Controller'],[750,'Service-held'],[1150,'Repository-ridder'],[1600,'Spring-meester']];
let S={solved:{},ijstep:{},cur:0};
try{const raw=localStorage.getItem('sbLab.v1');if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem('sbLab.v1',JSON.stringify(S))}catch(e){}};
const TOTAL=LABS.reduce((a,l)=>a+l.ex.reduce((b,x)=>b+XPT[x.type],0),0);
function xp(){let t=0;LABS.forEach(l=>l.ex.forEach((x,i)=>{if(S.solved[l.id+'-'+i])t+=XPT[x.type]}));return t}
function hud(){const v=xp();document.getElementById('xp').textContent=v;let r=RANKS[0][1];RANKS.forEach(([m,n])=>{if(v>=m)r=n});document.getElementById('rank').textContent='· '+r;document.getElementById('bar').style.width=(v/TOTAL*100)+'%';nav()}
function solve(id){if(!S.solved[id]){S.solved[id]=true;save();hud();const el=document.getElementById('ex-'+id);if(el){el.classList.add('solved');el.querySelector('.badge .st').textContent='opgelost · +'+XPT[el.dataset.type]+' GP'}}}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function fb(box,ok,html){box.className='fb '+(ok?'ok':'bad');box.innerHTML=html;box.hidden=false}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function nav(){const n=document.getElementById('nav');n.innerHTML='';LABS.forEach((l,i)=>{const done=l.ex.filter((x,k)=>S.solved[l.id+'-'+k]).length;const b=el('button',done===l.ex.length?'done':done?'part':'','<span class="dot"></span>Lab '+(i+1));b.type='button';b.title=l.title;b.setAttribute('aria-current',i===S.cur?'true':'false');b.onclick=()=>go(i);n.appendChild(b)})}
function go(i){S.cur=i;save();render();try{history.replaceState(null,'','#'+LABS[i].id)}catch(e){}window.scrollTo({top:0})}

function render(){
 const L=LABS[S.cur],m=document.getElementById('main');m.innerHTML='';
 const head=el('div');head.innerHTML=`<div class="eyebrow">Lab ${S.cur+1} · ${L.tag}</div><h2>${L.title}</h2><p class="lead">${L.lead}</p><div class="reads">${L.read.map(r=>R(r[0],r[1])).join('')}</div>`;m.appendChild(head);
 L.blocks.forEach(b=>{const c=el('section','card');c.innerHTML=`<h3>${b.h}</h3>${b.html}`;m.appendChild(c)});
 m.appendChild(el('div','sect','Oefeningen · '+L.ex.length));
 L.ex.forEach((x,i)=>m.appendChild(build(L,x,i)));
 const all=L.ex.every((x,i)=>S.solved[L.id+'-'+i]);
 if(all){const c=el('section','card score');c.innerHTML=`<b>✓</b><p>Lab ${S.cur+1} is af.</p>`;m.appendChild(c)}
 const nb=el('div','navbtm');
 if(S.cur>0){const p=el('button','btn','← Lab '+S.cur);p.type='button';p.onclick=()=>go(S.cur-1);nb.appendChild(p)}else nb.appendChild(el('span'));
 if(S.cur<LABS.length-1){const n=el('button','btn primary','Lab '+(S.cur+2)+' →');n.type='button';n.onclick=()=>go(S.cur+1);nb.appendChild(n)}
 m.appendChild(nb);nav();
}

function build(L,x,i){
 const id=L.id+'-'+i,solved=!!S.solved[id];
 const box=el('article','ex t-'+x.type+(solved?' solved':''));box.id='ex-'+id;box.dataset.type=x.type;
 const head=el('div','head');head.innerHTML=`<h3>${i+1}. ${x.title}</h3><span class="badge"><span class="ty">${TYN[x.type]}</span><span class="st">${solved?'opgelost · +'+XPT[x.type]+' GP':XPT[x.type]+' GP'}</span></span>`;box.appendChild(head);
 if(x.q){const q=el('div','',`<p>${x.q}</p>`);box.appendChild(q)}
 const f=el('div','fb');f.hidden=true;
 ({mc,sort,order,fill,line,code,ij})[x.type](box,x,id,f,solved);
 if(x.note)box.appendChild(el('div','',x.note));
 box.appendChild(f);
 return box;
}

function mc(box,x,id,f,solved){
 let pick=-1;const o=el('div','opts');const btns=[];
 x.opts.forEach((op,k)=>{const b=el('button','opt',`<span class="k">${'ABCDEF'[k]}</span><span>${op.t}</span>`);b.type='button';b.setAttribute('aria-pressed','false');
  b.onclick=()=>{pick=k;btns.forEach(z=>z.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');chk.disabled=false};btns.push(b);o.appendChild(b)});
 box.appendChild(o);
 const a=el('div','actions');const chk=el('button','btn primary','Controleer');chk.type='button';chk.disabled=true;a.appendChild(chk);box.appendChild(a);
 const win=()=>{btns.forEach((z,k)=>{z.disabled=true;if(k===x.a)z.classList.add('good')});chk.hidden=true;fb(f,true,'<strong>Juist.</strong> '+x.why)};
 chk.onclick=()=>{if(pick===x.a){win();solve(id)}else fb(f,false,'<strong>Nog niet.</strong> '+(x.opts[pick].no||'Kijk nog eens naar de uitleg hierboven.'))};
 if(solved)win();
}

function sort(box,x,id,f,solved){
 const ans=x.rows.map(()=>-1);const wrap=el('div');const rows=[];
 x.rows.forEach((r,k)=>{const row=el('div','sortrow');row.appendChild(el('div','txt',r[0].replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])).replace(/(@\w+|\w+\(\)|[\w.]+::\w+)/g,'<code>$1</code>')));
  const seg=el('div','seg');x.cats.forEach((c,ci)=>{const b=el('button','',esc(c));b.type='button';b.setAttribute('aria-pressed','false');b.onclick=()=>{ans[k]=ci;[...seg.children].forEach(z=>z.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');row.classList.remove('wrong')};seg.appendChild(b)});
  row.appendChild(seg);rows.push(row);wrap.appendChild(row)});
 box.appendChild(wrap);
 const a=el('div','actions');const chk=el('button','btn primary','Controleer');chk.type='button';a.appendChild(chk);box.appendChild(a);
 const win=()=>{rows.forEach((row,k)=>{[...row.querySelector('.seg').children].forEach((b,ci)=>{b.setAttribute('aria-pressed',ci===x.rows[k][1]?'true':'false');b.disabled=true})});chk.hidden=true;fb(f,true,'<strong>Alles juist.</strong> '+x.why)};
 chk.onclick=()=>{if(ans.includes(-1)){fb(f,false,'Kies eerst bij elke regel een antwoord.');return}let w=0;rows.forEach((row,k)=>{const bad=ans[k]!==x.rows[k][1];row.classList.toggle('wrong',bad);if(bad)w++});if(!w){win();solve(id)}else fb(f,false,`<strong>${w} ${w===1?'regel klopt':'regels kloppen'} nog niet</strong> (rood gemarkeerd).`)};
 if(solved)win();
}

function order(box,x,id,f,solved){
 let seq=[];const pool=shuffle(x.items.map((t,k)=>k));
 const lp=el('div','lbl','Nog te plaatsen');const pl=el('div','pool');const ls=el('div','lbl','Jouw volgorde');const sq=el('div','seq');
 const draw=()=>{pl.innerHTML='';sq.innerHTML='';pool.filter(k=>!seq.includes(k)).forEach(k=>{const c=el('button','chip',esc(x.items[k]));c.type='button';c.onclick=()=>{seq.push(k);draw()};pl.appendChild(c)});
  seq.forEach((k,n)=>{const c=el('button','chip',`<span class="nr">${n+1}</span>${esc(x.items[k])}`);c.type='button';c.onclick=()=>{seq=seq.filter(z=>z!==k);draw()};sq.appendChild(c)});chk.disabled=seq.length!==x.items.length};
 box.append(lp,pl,ls,sq);
 const a=el('div','actions');const chk=el('button','btn primary','Controleer');chk.type='button';const rs=el('button','btn','Opnieuw');rs.type='button';rs.onclick=()=>{seq=[];draw()};a.append(chk,rs);box.appendChild(a);
 const win=()=>{seq=x.items.map((t,k)=>k);draw();[...sq.children].forEach(c=>c.disabled=true);chk.hidden=true;rs.hidden=true;lp.hidden=true;pl.hidden=true;fb(f,true,'<strong>Juist.</strong> '+x.why)};
 chk.onclick=()=>{const firstBad=seq.findIndex((k,n)=>k!==n);if(firstBad<0){win();solve(id)}else fb(f,false,`Plaats ${firstBad+1} klopt nog niet. Klik op een stap om ze terug te zetten.`)};
 draw();if(solved)win();
}

function fill(box,x,id,f,solved){
 const pre=el('pre','code fill');const inputs=[];
 pre.innerHTML=esc(x.code).replace(/__(\d)__/g,(m,d)=>`<input data-i="${d}" aria-label="Invulveld ${+d+1}" autocomplete="off" spellcheck="false" style="width:${(x.w&&x.w[d]||8)+2}ch">`);
 box.appendChild(pre);pre.querySelectorAll('input').forEach(inp=>{inp.id='in-'+id+'-'+inp.dataset.i;inputs.push(inp)});
 const a=el('div','actions');const chk=el('button','btn primary','Controleer');chk.type='button';a.appendChild(chk);box.appendChild(a);
 const win=()=>{inputs.forEach(inp=>{inp.classList.add('ok');inp.disabled=true});chk.hidden=true;fb(f,true,'<strong>Juist.</strong> '+x.why)};
 chk.onclick=()=>{let w=0;inputs.forEach(inp=>{const ok=x.ans[+inp.dataset.i].test(inp.value.trim().replace(/^@/,''));inp.classList.toggle('ok',ok);inp.classList.toggle('bad',!ok);if(!ok)w++});if(!w){win();solve(id)}else fb(f,false,`${w} ${w===1?'veld klopt':'velden kloppen'} nog niet. Let op hoofdletters.`)};
 if(solved){inputs.forEach(inp=>{inp.value=''});win()}
}

function line(box,x,id,f,solved){
 const sel=new Set();const wrap=el('div','codelines');const btns=[];
 x.code.split('\n').forEach((t,k)=>{const b=el('button','cl',`<span class="n">${k+1}</span><span>${esc(t)||' '}</span>`);b.type='button';b.setAttribute('aria-pressed','false');b.onclick=()=>{if(sel.has(k))sel.delete(k);else sel.add(k);b.setAttribute('aria-pressed',sel.has(k)?'true':'false')};btns.push(b);wrap.appendChild(b)});
 box.appendChild(wrap);
 const a=el('div','actions');const chk=el('button','btn primary','Controleer');chk.type='button';a.appendChild(chk);box.appendChild(a);
 const win=()=>{btns.forEach((b,k)=>{b.disabled=true;b.setAttribute('aria-pressed','false');if(x.bad.includes(k))b.classList.add('good')});chk.hidden=true;fb(f,true,'<strong>Gevonden.</strong> '+x.why)};
 chk.onclick=()=>{if(!sel.size){fb(f,false,'Klik eerst op een regel.');return}const ok=sel.size===x.bad.length&&x.bad.every(k=>sel.has(k));if(ok){win();solve(id)}else fb(f,false,'Dat is niet de regel die het probleem veroorzaakt. Lees de code nog eens van boven naar beneden.')};
 if(solved)win();
}

function code(box,x,id,f,solved){
 const ed=el('div','editor');ed.innerHTML=`<div class="ebar"><span class="path">${esc(x.file)}</span><span>Java</span></div>`;
 const body=el('div','ebody');const gut=el('div','gutter');const ta=el('textarea','code');ta.id='ta-'+id;ta.spellcheck=false;ta.setAttribute('aria-label','Code-editor');
 let saved=null;try{saved=localStorage.getItem('sbLab.code.'+id)}catch(e){}
 ta.value=saved!=null?saved:x.start;
 const sync=()=>{const n=ta.value.split('\n').length;gut.textContent=Array.from({length:n},(_,k)=>k+1).join('\n');ta.style.height='auto';ta.style.height=Math.max(200,ta.scrollHeight)+'px';try{localStorage.setItem('sbLab.code.'+id,ta.value)}catch(e){}};
 ta.addEventListener('input',sync);
 ta.addEventListener('keydown',e=>{if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('    ',s,ta.selectionEnd,'end');sync()}});
 body.append(gut,ta);ed.appendChild(body);box.appendChild(ed);
 const ul=el('ul','reqs');const lis=x.reqs.map(r=>{const li=el('li','',`<span class="st">·</span><span>${esc(r[1])}</span>`);ul.appendChild(li);return li});
 box.appendChild(el('div','lbl','Wat er gecontroleerd wordt'));box.appendChild(ul);
 const a=el('div','actions');const chk=el('button','btn primary','Controleer');chk.type='button';const rs=el('button','btn','Beginsituatie');rs.type='button';rs.onclick=()=>{ta.value=x.start;sync()};a.append(chk,rs);box.appendChild(a);
 const sol=el('details','sol',`<summary>Toon een mogelijke oplossing</summary><pre class="code">${esc(x.sol)}</pre>`);box.appendChild(sol);
 chk.onclick=()=>{const src=ta.value.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'');let w=0;x.reqs.forEach((r,k)=>{const ok=r[0].test(src);lis[k].className=ok?'ok':'bad';lis[k].querySelector('.st').textContent=ok?'✓':'✗';if(!ok)w++});
  if(!w){fb(f,true,'<strong>Alle controles slagen.</strong> Zet deze code nu ook in IntelliJ en voer ze uit.');solve(id)}else fb(f,false,`${w} ${w===1?'controle faalt':'controles falen'}. Begin bij de eerste ✗.`)};
 requestAnimationFrame(sync);
}

function ij(box,x,id,f,solved){
 const ol=el('ol','steps');const items=[];
 let at=solved?x.steps.length:(S.ijstep[id]||0);
 x.steps.forEach((s,k)=>{const li=el('li','step');li.innerHTML=`<span class="num">${k+1}</span><div class="body">${s}<div class="stepact"></div></div>`;
  const act=li.querySelector('.stepact');const b=el('button','btn ij',k===x.steps.length-1?'Gedaan':'Gedaan, volgende stap');b.type='button';b.onclick=()=>{at=k+1;S.ijstep[id]=at;save();draw();if(at===x.steps.length&&!x.answer){finish();solve(id)}else if(items[at])items[at].querySelector('.btn')?.focus()};act.appendChild(b);items.push(li);ol.appendChild(li)});
 box.appendChild(ol);
 let ansWrap=null;
 if(x.answer){ansWrap=el('div','');ansWrap.innerHTML=`<p><strong>Controlevraag.</strong> ${x.answer.q}</p>`;const row=el('div','actions');const inp=el('input','ans');inp.id='ans-'+id;inp.autocomplete='off';inp.setAttribute('aria-label','Antwoord');const ok=el('button','btn primary','Controleer');ok.type='button';
  ok.onclick=()=>{if(x.answer.re.test(inp.value.trim())){finish();solve(id)}else fb(f,false,x.answer.err||'Dat lijkt niet te kloppen.')};inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok.click()});row.append(inp,ok);ansWrap.appendChild(row);box.appendChild(ansWrap)}
 const restart=el('button','btn','Stappen opnieuw tonen');restart.type='button';restart.hidden=true;restart.onclick=()=>{at=0;S.ijstep[id]=0;save();draw();f.hidden=true};box.appendChild(restart);
 function finish(){if(ansWrap)ansWrap.hidden=true;restart.hidden=false;fb(f,true,'<strong>Goed gedaan.</strong> '+(x.done||''))}
 function draw(){items.forEach((li,k)=>{li.hidden=k>at;li.classList.toggle('done',k<at)});if(ansWrap)ansWrap.hidden=at<x.steps.length;restart.hidden=at<x.steps.length}
 draw();if(solved)finish();
}
