<style>
/* Layout: werkbank — vaste stappenlijst links, één stap tegelijk rechts. Okerkleurig accent (giraf), rood = kritiek pad. */
:root{
  --bg:#f3f4f1;
  --surface:#ffffff;
  --ink:#1d2421;
  --muted:#5f6a64;
  --line:#d9ddd6;
  --accent:#a8650f;
  --accent-soft:#f6ead7;
  --crit:#c23a2b;
  --ok:#2f7d4f;
  --ok-soft:#e2f1e7;
  --bad-soft:#f8e1dd;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}


*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.5rem}
h2{font-size:1.6rem}
h3{font-size:1.05rem;margin-top:4px}
code,.mono{font-family:var(--font-mono);font-size:.92em}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.top .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;color:var(--muted);background:var(--bg)}
.pill strong{color:var(--ink);font-variant-numeric:tabular-nums}
.pill.id{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.progress{display:flex;align-items:center;gap:10px;min-width:220px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.progress small{font-variant-numeric:tabular-nums;color:var(--muted)}

.wrap{display:grid;grid-template-columns:290px 1fr;gap:0;min-height:calc(100vh - 80px)}
nav{border-right:1px solid var(--line);padding:16px 12px;background:var(--surface)}
nav .group{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 8px 6px;font-weight:600}
nav .group:first-child{margin-top:0}
nav button.step{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:.92rem;align-items:flex-start}
nav button.step:hover{background:var(--bg)}
nav button.step.active{background:var(--accent-soft);color:var(--ink);font-weight:600}
nav .dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;display:grid;place-items:center;font-size:11px;color:transparent}
nav .done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
nav .part .dot{border-color:var(--accent)}
.mobile-nav{display:none}

main{padding:28px 32px 48px;max-width:880px}
.eyebrow{font-size:.8rem;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.lead{color:var(--muted);max-width:65ch;margin:8px 0 0}
.block{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.block p,.block li{max-width:68ch}
.block ul,.block ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.path{font-family:var(--font-mono);font-size:.88rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:block;overflow-x:auto}
.src{font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.think{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.think strong{color:var(--accent)}
.warn{border-left:3px solid var(--crit);padding:6px 12px;background:var(--bad-soft);border-radius:0 6px 6px 0}

details{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details summary{cursor:pointer;padding:10px 14px;font-weight:500}
details > div{padding:0 14px 12px}

.checklist{list-style:none;padding:0!important;display:flex;flex-direction:column;gap:6px}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.checklist input{margin-top:4px;accent-color:var(--ok);width:16px;height:16px;flex:none}
.checklist label.checked{background:var(--ok-soft);border-color:transparent}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
tr:last-child td{border-bottom:0}
input.cell{width:76px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:right;font-family:var(--font-mono)}
input.cell.ok{border-color:var(--ok);background:var(--ok-soft)}
input.cell.bad{border-color:var(--crit);background:var(--bad-soft)}
input.wide{width:150px;text-align:left}
.crit-pick{display:flex;flex-wrap:wrap;gap:6px}
.crit-pick label{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-family:var(--font-mono);background:var(--surface)}
.crit-pick input{accent-color:var(--crit)}
.crit-pick label.on{border-color:var(--crit);color:var(--crit)}

.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.feedback{font-size:.92rem;font-weight:500}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--crit)}
.nextprev{display:flex;justify-content:space-between;gap:12px;margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}

@media (max-width: 820px){
  .wrap{grid-template-columns:1fr}
  nav{display:none}
  .mobile-nav{display:block;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mobile-nav select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
  main{padding:20px 16px 40px}
  .top{padding:14px 16px}
}
@media (prefers-reduced-motion: reduce){ .bar span{transition:none} }
</style>

<script>
/* ---------- Gegevens uit de opgave (ID = 1) ---------- */
const ID = 1;
const TASKS = [
  {id:'A', name:'Business- & Compliance-Analyse', pred:[], to:4, tl:10, tp:28},
  {id:'B', name:'Architectuur- & AI-Ontwerp', pred:['A'], to:1, tl:2, tp:9},
  {id:'C', name:'Webshop & E-commerce Ontwikkeling', pred:['B'], to:8, tl:11, tp:26},
  {id:'D', name:'Integratie AI-Symptoomchecker', pred:['B'], to:4, tl:10, tp:28},
  {id:'E', name:'Ontwikkeling LMS', pred:['B'], to:6, tl:10, tp:14},
  {id:'F', name:'Community Platform & Netwerk Hub', pred:['B'], to:4, tl:8, tp:12},
  {id:'G', name:'Integratie Betalingssysteem', pred:['C'], to:1, tl:3, tp:5},
  {id:'H', name:'Productcatalogus & Voorraadbeheer', pred:['C'], to:3, tl:11, tp:25},
  {id:'I', name:'Creatie Medische & IT-Cursussen', pred:['E'], to:2, tl:8, tp:20},
  {id:'J', name:'Beveiligingsaudit', pred:['D','G','I','F'], fixed:3*ID},
  {id:'K', name:'AI-Carrièreadviseur Module 2.0', pred:['I','F'], to:1, tl:8, tp:21},
  {id:'L', name:'User Acceptance Testing', pred:['J','H'], to:6, tl:7, tp:20},
  {id:'M', name:'Marketing & Officiële Go-Live', pred:['K','L'], to:1, tl:2, tp:3},
];

/* Pure PERT-berekening: Te, vroegste begin (ES), laatst toelaatbaar einde (LF), speling */
function pert(tasks){
  const te = {}, es = {}, ef = {}, lf = {}, ls = {};
  tasks.forEach(t => te[t.id] = t.fixed !== undefined ? t.fixed : (t.to + 4*t.tl + t.tp)/6);
  tasks.forEach(t => { es[t.id] = t.pred.length ? Math.max(...t.pred.map(p => ef[p])) : 0; ef[t.id] = es[t.id] + te[t.id]; });
  const end = Math.max(...tasks.map(t => ef[t.id]));
  [...tasks].reverse().forEach(t => {
    const succ = tasks.filter(s => s.pred.includes(t.id));
    lf[t.id] = succ.length ? Math.min(...succ.map(s => ls[s.id])) : end;
    ls[t.id] = lf[t.id] - te[t.id];
  });
  const slack = {}; tasks.forEach(t => slack[t.id] = ls[t.id] - es[t.id]);
  const critical = tasks.filter(t => Math.abs(slack[t.id]) < 1e-9).map(t => t.id);
  return {te, es, ef, lf, ls, slack, critical, end};
}
const P = pert(TASKS);

/* MS Project-taken met hun duur volgens de opgave */
const MSP = [
  {k:'A', name:'Business- & Compliance-Analyse', dur:P.te.A},
  {k:'B', name:'Architectuur- & AI-ontwerp', dur:P.te.B},
  {k:'E', name:'Ontwikkelen LMS-basisplatform', dur:P.te.E},
  {k:'F', name:'Ontwikkelen community platform', dur:P.te.F},
  {k:'I', name:'Creatie medische & IT-cursussen', dur:P.te.I},
  {k:'WS', name:'Ontwikkelen webshop', dur:26},
  {k:'EC', name:'Ontwikkelen e-commerce platform', dur:26},
  {k:'D', name:'Integratie AI-symptoomchecker', dur:P.te.D},
  {k:'G', name:'Integratie betalingssysteem', dur:P.te.G},
  {k:'H', name:'Productcatalogus & voorraadbeheer (eindduur)', dur:P.te.H/2},
  {k:'J', name:'Beveiligingsaudit', dur:P.te.J},
  {k:'K', name:'AI-carrièreadviseur module 2.0', dur:P.te.K},
  {k:'L', name:'User Acceptance Testing', dur:P.te.L},
  {k:'M', name:'Marketing & officiële Go-Live', dur:P.te.M},
];

/* ---------- Opslag (alleen in deze browser) ---------- */
const KEY = 'pe-pm-2tiw-g01';
let S = {step:0, checks:{}, inputs:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- Helpers ---------- */
const num = v => { if (v === undefined || v === null) return NaN; const s = String(v).trim().replace(',', '.'); return s === '' ? NaN : Number(s); };
const eq = (a,b) => Math.abs(a-b) < 0.01;
const fmt = n => (Math.round(n*100)/100).toString().replace('.', ',');
const path = s => `<code class="path">${s}</code>`;
const think = s => `<div class="think"><strong>Denkvraag</strong> · ${s}</div>`;
const src = s => `<div class="src">${s}</div>`;
const reveal = (title, body) => `<details><summary>${title}</summary><div>${body}</div></details>`;

/* ---------- Stappen ---------- */
const STEPS = [
/* ===== PERT ===== */
{group:'1 · PERT', title:'Expected time per taak', eyebrow:'PERT · stap 1 van 6',
 lead:'Bereken Te voor elke taak met de formule uit de cursus. Raffie schat optimistisch (To), Geoffrey meest waarschijnlijk (Tl), Melman pessimistisch (Tp).',
 body:() => `
  ${src('Cursus deel I, §2.2.2 Tijdsfactor, figuur 20 (formule expected time)')}
  ${think('In welke kolom van de tabel staat Tp? Let op: de opgave zet de schatters in de volgorde Raffie, Geoffrey, Melman. Welk gewicht krijgt de meest waarschijnlijke schatting?')}
  ${reveal('Hint: de formule', '<p>Te = (To + 4·Tl + Tp) / 6</p>')}
  <div class="tablewrap"><table>
   <thead><tr><th>Act.</th><th>Beschrijving</th><th class="num">To</th><th class="num">Tl</th><th class="num">Tp</th><th class="num">Jouw Te</th></tr></thead>
   <tbody>${TASKS.map(t => `<tr><td class="mono">${t.id}</td><td>${t.name}</td>
     ${t.fixed!==undefined ? `<td class="num" colspan="3" style="text-align:center;color:var(--muted)">vast: 3 × ID</td>` : `<td class="num">${t.to}</td><td class="num">${t.tl}</td><td class="num">${t.tp}</td>`}
     <td class="num"><input class="cell" id="te-${t.id}" data-check="te" data-k="${t.id}" inputmode="decimal" aria-label="Te ${t.id}"></td></tr>`).join('')}</tbody>
  </table></div>
  <div class="btns"><button class="btn primary" data-action="check" data-set="te">Controleer</button><span class="feedback" id="fb-te"></span></div>
  <ul class="checklist">${chk('p1a','Alle 13 Te-waarden zijn juist')}</ul>`},

{group:'1 · PERT', title:'Netwerk opbouwen', eyebrow:'PERT · stap 2 van 6',
 lead:'Zet de afhankelijkheden om naar een netwerk. In de cursus is een pijl een activiteit en een cirkel een knooppunt (gebeurtenis).',
 body:() => `
  ${src('Cursus deel I, §2.2.1 Hoofdbegrippen: knooppunt, activiteit, relatielijn (0-lijn), figuur 19 referentieschema')}
  <ol>
   <li>Begin met één startknooppunt. A vertrekt daar.</li>
   <li>Na B vertrekken C, D, E en F uit hetzelfde knooppunt.</li>
   <li>Werk taak per taak verder met de kolom “voorafgegaan door”.</li>
  </ol>
  ${think('J wacht op D, G, I én F. K wacht alleen op I en F. Kunnen I en F in hetzelfde knooppunt eindigen als D en G? Wat gebeurt er dan met K? Welk element uit de cursus lost dit op?')}
  <div class="btns">Hoeveel relatielijnen (0-lijnen) heb je minimaal nodig? <input class="cell" id="dummies" data-k="dummies" inputmode="numeric" aria-label="Aantal relatielijnen"><button class="btn" data-action="check" data-set="dummies">Controleer</button><span class="feedback" id="fb-dummies"></span></div>
  ${think('Hoeveel eindknooppunten mag een PERT-netwerk hebben?')}
  <ul class="checklist">${chk('p2a','Elke activiteit is één pijl met letter en Te')}${chk('p2b','Eén start- en één eindknooppunt')}${chk('p2c','Relatielijn(en) gestippeld met een 0')}</ul>`},

{group:'1 · PERT', title:'Voorwaartse gang (TE)', eyebrow:'PERT · stap 3 van 6',
 lead:'Bereken voor elk knooppunt de TE: het vroegste tijdstip waarop het bereikt wordt. Komen er meerdere paden samen, dan neem je het grootste.',
 body:() => `
  ${src('Cursus deel I, §2.2.2 “TE = Earliest expected time”')}
  <p>Vul hieronder de TE in van het knooppunt waar elke activiteit <em>vertrekt</em> (= het vroegste begin van die activiteit).</p>
  ${think('Bij het knooppunt vóór J komen D, G, de relatielijn en (via die lijn) I en F samen. Welke waarde wint?')}
  <div class="tablewrap"><table><thead><tr><th>Act.</th><th>Voorgangers</th><th class="num">TE beginknooppunt</th></tr></thead>
  <tbody>${TASKS.map(t => `<tr><td class="mono">${t.id}</td><td class="mono">${t.pred.join(', ')||'/'}</td><td class="num"><input class="cell" id="es-${t.id}" data-check="es" data-k="${t.id}" inputmode="decimal" aria-label="TE ${t.id}"></td></tr>`).join('')}</tbody></table></div>
  <div class="btns">Doorlooptijd project (TE eindknooppunt): <input class="cell" id="end" data-k="end" inputmode="decimal" aria-label="Doorlooptijd"> dagen</div>
  <div class="btns"><button class="btn primary" data-action="check" data-set="es">Controleer</button><span class="feedback" id="fb-es"></span></div>
  <ul class="checklist">${chk('p3a','TE staat bij elk knooppunt in mijn tekening')}</ul>`},

{group:'1 · PERT', title:'Achterwaartse gang (TL)', eyebrow:'PERT · stap 4 van 6',
 lead:'Start bij het eindknooppunt met TL = TE en reken terug. Vertrekken er meerdere pijlen uit een knooppunt, dan neem je het kleinste.',
 body:() => `
  ${src('Cursus deel I, §2.2.2 “TL = Latest allowable time” en “Speling”')}
  <p>Vul de TL in van het knooppunt waar elke activiteit <em>aankomt</em> (= het laatst toelaatbare einde).</p>
  ${think('Uit het knooppunt na I en F vertrekken K én de relatielijn naar J. Welke van de twee bepaalt de TL van dat knooppunt?')}
  <div class="tablewrap"><table><thead><tr><th>Act.</th><th class="num">TL eindknooppunt</th><th class="num">Speling (TL − TE begin − Te)</th></tr></thead>
  <tbody>${TASKS.map(t => `<tr><td class="mono">${t.id}</td><td class="num"><input class="cell" id="lf-${t.id}" data-check="lf" data-k="${t.id}" inputmode="decimal" aria-label="TL ${t.id}"></td><td class="num"><input class="cell" id="sl-${t.id}" data-check="sl" data-k="${t.id}" inputmode="decimal" aria-label="Speling ${t.id}"></td></tr>`).join('')}</tbody></table></div>
  <div class="btns"><button class="btn primary" data-action="check" data-set="lf">Controleer</button><span class="feedback" id="fb-lf"></span></div>
  <ul class="checklist">${chk('p4a','TL staat bij elk knooppunt in mijn tekening')}</ul>`},

{group:'1 · PERT', title:'Kritieke pad', eyebrow:'PERT · stap 5 van 6',
 lead:'Het kritieke pad is het langste pad van start tot einde. Op dat pad is de speling overal 0.',
 body:() => `
  ${src('Cursus deel I, §2.2.3 Kritieke pad')}
  <p>Selecteer de activiteiten op het kritieke pad:</p>
  <div class="crit-pick">${TASKS.map(t => `<label class="${S.inputs['cp-'+t.id]?'on':''}"><input type="checkbox" id="cp-${t.id}" data-k="cp-${t.id}"> ${t.id}</label>`).join('')}</div>
  <div class="btns"><button class="btn primary" data-action="check" data-set="cp">Controleer</button><span class="feedback" id="fb-cp"></span></div>
  ${think('Tel de Te’s van jouw pad op. Komt dat uit op de doorlooptijd uit stap 3?')}
  <ul class="checklist">${chk('p5a','Kritieke pad is in kleur of dikker aangeduid in de tekening')}</ul>`},

{group:'1 · PERT', title:'Tekening afwerken', eyebrow:'PERT · stap 6 van 6',
 lead:'Werk het schema netjes uit. De opgave laat de tool vrij; bij Draw.io moet het .drawio-bestand mee in de zip.',
 body:() => `
  <ul>
   <li>Knooppunt zoals in de cursusoefeningen: cirkel met links het nummer (Romeinse cijfers), rechts boven TE en rechts onder TL.</li>
   <li>Pijl: letter van de activiteit + Te.</li>
   <li>Legende voor het kritieke pad en de 0-lijn.</li>
   <li>Vermeld de doorlooptijd van het project.</li>
  </ul>
  <ul class="checklist">${chk('p6a','Activiteiten, TE en TL bij elk knooppunt staan erop')}${chk('p6b','Kritieke pad en doorlooptijd staan erop')}${chk('p6c','Opgeslagen als PDF/PNG + bronbestand (.drawio)')}</ul>`},

/* ===== MS PROJECT versie 1 ===== */

{group:'4 · Oplevering', title:'Zip en indienen', eyebrow:'Oplevering',
 lead:'Dien in via Blackboard › Evaluaties, uiterlijk vrijdag 15 januari 2027 om 17:30. Te laat = 0.',
 body:() => `
  <p>Naam van de zip: <code>2TIW – 1.zip</code></p>
  <ul class="checklist">
   ${chk('z1','PERT-schema met doorlooptijd en kritieke pad (+ .drawio als je Draw.io gebruikte)')}
   ${chk('z2','Melmans MMM 1 - versie 1.mpp')}
   ${chk('z3','Melmans MMM 1 - versie 2.mpp')}
   ${chk('z4','Screenshot Vergelijkende Gantt')}
   ${chk('z5','Kosten- en batenanalyse (volgt in deel 2 van de opgave)')}
   ${chk('z6','Zip ingediend in Blackboard')}
  </ul>
  <p class="src">Kosten-batenanalyse zit nog niet in deze gids: die opgave komt na de lessen erover.</p>`},
];

function chk(id, label){ const on = !!S.checks[id]; return `<li><label class="${on?'checked':''}"><input type="checkbox" data-chk="${id}" ${on?'checked':''}> <span>${label}</span></label></li>`; }

/* ---------- Controles ---------- */
const CHECKS = {
  te(){ return cells('te', id => P.te[id]); },
  es(){ const r = cells('es', id => P.es[id]); const e = mark('end', P.end); return combine(r, e); },
  lf(){ const a = cells('lf', id => P.lf[id]); const b = cells('sl', id => P.slack[id]); return combine(a,b); },
  dur(){ let ok=0, n=0; MSP.forEach(m => { const r = mark('d-'+m.k, m.dur); if (r!==null){ n++; if(r) ok++; } }); return {ok, n, total:MSP.length}; },
  dummies(){ return single(mark('dummies', 1)); },
  hours(){ return combine(asRes(mark('hmd', 8)), asRes(mark('hvr', 8)), 2); },
  leo(){ return single(mark('leo', 20 + ID)); },
  raf(){
    const el = document.getElementById('raf'); const v = (el.value||'').trim();
    const okDate = /^0?1[-\/.]0?3[-\/.](2027|27)$/.test(v);
    el.classList.toggle('ok', okDate); el.classList.toggle('bad', v!=='' && !okDate);
    const r2 = mark('rafn', ID);
    return combine({ok:okDate?1:0, n:v?1:0, total:1}, asRes(r2), 2);
  },
  mnew(){ return single(mark('mnew', P.te.M + 5)); },
  var(){ return single(mark('var', 5*8*65)); },
  cp(){
    const chosen = TASKS.filter(t => document.getElementById('cp-'+t.id).checked).map(t => t.id);
    const right = chosen.length === P.critical.length && P.critical.every(c => chosen.includes(c));
    return {ok:right?1:0, n:1, total:1, text: right ? 'Juist kritiek pad.' : `Nog niet juist (${chosen.length} gekozen). Kijk naar de speling uit stap 4.`};
  },
};
function mark(id, expected){
  const el = document.getElementById(id); if (!el) return null;
  const v = num(el.value);
  el.classList.remove('ok','bad');
  if (isNaN(v)) return null;
  const good = eq(v, expected); el.classList.add(good ? 'ok' : 'bad'); return good;
}
function cells(prefix, fn){ let ok=0, n=0; TASKS.forEach(t => { const r = mark(`${prefix}-${t.id}`, fn(t.id)); if (r!==null){ n++; if (r) ok++; } }); return {ok, n, total:TASKS.length}; }
function asRes(r){ return {ok:r?1:0, n:r===null?0:1, total:1}; }
function single(r){ return asRes(r); }
function combine(a, b, total){ return {ok:a.ok+b.ok, n:a.n+b.n, total: total || (a.total+b.total)}; }
function runCheck(set){
  const r = CHECKS[set](); const fb = document.getElementById('fb-'+set); if (!fb) return;
  if (r.text){ fb.textContent = r.text; fb.className = 'feedback ' + (r.ok===r.total ? 'ok' : 'bad'); return; }
  if (r.n === 0){ fb.textContent = 'Vul eerst iets in.'; fb.className = 'feedback'; return; }
  const all = r.ok === r.total;
  fb.textContent = all ? 'Alles juist.' : `${r.ok} van ${r.total} juist${r.n < r.total ? ` (${r.total - r.n} nog leeg)` : ''}. Rood = herbekijk.`;
  fb.className = 'feedback ' + (all ? 'ok' : 'bad');
}

/* ---------- Rendering ---------- */
const nav = document.getElementById('nav'), main = document.getElementById('main'), sel = document.getElementById('stepselect');
function stepChecks(i){ const m = STEPS[i].body().match(/data-chk="([^"]+)"/g) || []; return m.map(x => x.slice(10,-1)); }
const STEP_IDS = STEPS.map((_, i) => stepChecks(i));
function stepState(i){ const ids = STEP_IDS[i]; const d = ids.filter(id => S.checks[id]).length; return d === 0 ? '' : d === ids.length ? 'done' : 'part'; }

function renderNav(){
  let html = '', last = '';
  STEPS.forEach((s, i) => {
    if (s.group !== last){ html += `<div class="group">${s.group}</div>`; last = s.group; }
    html += `<button class="step ${i===S.step?'active':''} ${stepState(i)}" data-go="${i}"><span class="dot">✓</span><span>${s.title}</span></button>`;
  });
  nav.innerHTML = html;
  sel.innerHTML = STEPS.map((s,i) => `<option value="${i}" ${i===S.step?'selected':''}>${s.group} · ${s.title}${stepState(i)==='done'?' ✓':''}</option>`).join('');
  const all = STEP_IDS.flat(); const done = all.filter(id => S.checks[id]).length;
  const pct = Math.round(done / all.length * 100);
  document.getElementById('barfill').style.width = pct + '%';
  document.getElementById('bartext').textContent = `${pct}% · ${done}/${all.length}`;
}
function renderStep(){
  const s = STEPS[S.step];
  main.innerHTML = `<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2><p class="lead">${s.lead}</p>
    <div class="block">${s.body()}</div>
    <div class="nextprev">
      <button class="btn" data-go="${S.step-1}" ${S.step===0?'disabled':''}>← Vorige</button>
      <button class="btn primary" data-go="${S.step+1}" ${S.step===STEPS.length-1?'disabled':''}>Volgende →</button>
    </div>`;
  main.querySelectorAll('input[data-k]').forEach(el => {
    const v = S.inputs[el.dataset.k];
    if (el.type === 'checkbox') el.checked = !!v; else if (v !== undefined) el.value = v;
  });
}
function go(i){ if (i<0 || i>=STEPS.length) return; S.step = i; save(); renderNav(); renderStep(); window.scrollTo({top:0}); }

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g && !g.disabled){ go(+g.dataset.go); return; }
  const a = e.target.closest('[data-action="check"]'); if (a){ runCheck(a.dataset.set); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.k){
    S.inputs[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'checkbox') el.closest('label').classList.toggle('on', el.checked);
    save();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.chk){ S.checks[el.dataset.chk] = el.checked; el.closest('label').classList.toggle('checked', el.checked); save(); renderNav(); }
});
sel.addEventListener('change', () => go(+sel.value));

/* Aftellen tot de deadline */
function countdown(){
  const ms = new Date('2027-01-15T17:30:00+01:00') - new Date();
  const el = document.getElementById('countdown');
  if (ms <= 0){ el.innerHTML = '<strong>deadline voorbij</strong>'; return; }
  const d = Math.floor(ms/86400000);
  el.innerHTML = `nog <strong>${d} dagen</strong>`;
}
countdown();
renderNav(); renderStep();
</script>
</body>
</html>
