<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studyraf</title>
  <link rel="icon" href="assets/raf/raf-neutral.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="login" class="login" hidden>
    <img class="login__raf" src="assets/raf/raf-neutral.png" alt="Raf, de giraf van Studyraf">
    <h1>Studyraf</h1>
    <p class="login__tekst">Al je vakken, één plek. Raf houdt je bij de les.</p>
    <button id="login-btn" class="knop" type="button">Inloggen met Google</button>
    <p id="login-error" class="fout" role="alert" hidden></p>
  </main>

  <main id="hub" class="hub" hidden>
    <header class="hub__kop">
      <div class="hub__merk">
        <img src="assets/raf/raf-neutral.png" alt="" class="hub__raf">
        <span>Studyraf</span>
      </div>
      <button id="logout-btn" class="knop knop--stil" type="button">Uitloggen</button>
    </header>
    <h2 id="welkom"></h2>
    <section id="vakken" class="vakken" aria-label="Vakken"></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
